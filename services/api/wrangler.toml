name = "fonteia-api"
main = "src/worker.ts"
compatibility_date = "2026-06-10"

# Este Worker e o backend publico (somente leitura) do app:
#   GET  /leiloes/lotes       -> lotes ao vivo da Receita (sem segredo)
#   GET  /leiloes/lotes/:id   -> um lote
#   POST /ia/raio-x           -> analise por IA (requer ANTHROPIC_API_KEY)
#   GET  /health
#
# Deploy:  pnpm --filter @fonteia/api-worker run deploy
#   (ou: cd services/api && wrangler deploy --config wrangler.toml — o --config
#    e obrigatorio; sem ele o wrangler pega o wrangler.jsonc da raiz, que e o app web)
# URL de producao esperada: https://fonteia-api.<sua-conta>.workers.dev
#
# IA (rotas /ai/chat, /ai/intent, /ia/raio-x) — roteador multimodelo:
#   Gemini (Google) e o PADRAO GRATUITO; Claude (Anthropic) e o fallback/reforco.
#   Basta UMA das chaves para ligar a IA; com as duas, o roteador escolhe por tarefa.
#
#   wrangler secret put GEMINI_API_KEY         # padrao gratuito (Google AI Studio)
#   wrangler secret put ANTHROPIC_API_KEY      # opcional: fallback/analise profunda (sk-ant-...)
#
# Vars opcionais (dashboard ou [vars] abaixo):
#   GEMINI_MODEL      = "gemini-2.0-flash"     # rapido/barato (intent, chat)
#   GEMINI_MODEL_PRO  = "gemini-2.0-pro-exp"   # pesado (fallback de analise profunda)
#   ANTHROPIC_MODEL   = "claude-opus-4-8"      # padrao; troque por claude-haiku-4-5 p/ custo menor

# [vars]
# GEMINI_MODEL = "gemini-2.0-flash"
# ANTHROPIC_MODEL = "claude-opus-4-8"

# Gate das rotas /d1/* — chave publishable PUBLICA do Supabase (a mesma do bundle web).
# As rotas /d1/* exigem o header `apikey` igual a este valor (gate basico fail-closed:
# sem esta var, /d1/* responde 401). Configure com:
#   wrangler secret put SUPABASE_PUBLISHABLE_KEY   # cole o sb_publishable_...
# (pode ir em [vars] por ser publica, mas secret tambem serve.)

# Banco de dados público em massa migrado do Supabase — contém a tabela `entities`
# (pessoas jurídicas, órgãos públicos, leiloeiros e demais entidades indexadas).
# NOTA: a tabela `auction_lot` permanece no Supabase (dados transacionais / RLS).
[[d1_databases]]
binding = "DB"
database_name = "fonteia-data"
database_id = "417caa83-86dc-463e-8682-656cf938cd24"
